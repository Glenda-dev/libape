[package]
name = "libape"
version = "0.1.0"
edition = "2024"
description = "ANSI/POSIX Environment Library for Glenda Microkernel"
build = "build.rs"

[lib]
name = "ape"
crate-type = ["staticlib", "rlib"]

[[bin]]
name = "libape_daemon"
path = "src/main.rs"

[dependencies]
libglenda-rs = { path = "../libglenda-rs" }
linux-raw-sys = { version = "0.12.1", default-features = false, features = [
    "no_std",
    "errno",
    "general",
] }
num_enum = { version = "0.7.5", default-features = false }

[build-dependencies]
chrono = "0.4"

[features]
default = ["runtime"]
runtime = ["libglenda-rs/no-start", "libglenda-rs/rt-app"]
